name: Dartboard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dartboard-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve the committed lockfile for the declared Worker toolchain
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      # The scripts test glob includes parent app-builder fixture tests
      # not part of this dedicated Dartboard repository (.grok/ and
      # template source are intentionally not copied into split app repos).
      - name: Application unit tests
        run: >-
          node --experimental-strip-types --test
          src/lib/app-data/app-data.test.ts
          src/lib/app-data/readiness-schedule.test.ts
          src/lib/auth/gate-identity.test.ts
          src/lib/auth/sign-in-gate.test.ts
          src/lib/preview-path-prefix.test.ts
          src/lib/legal-routes.test.ts
      - name: Production Worker build
        run: npm run build
      - name: Upload the deployable Worker bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dartboard-worker-build
          path: |
            dist/
            package-lock.json
          if-no-files-found: warn
          retention-days: 3
      - name: Commit regenerated dependency lockfile
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock Cloudflare Worker toolchain"
            git push origin "HEAD:$BRANCH"
          fi
